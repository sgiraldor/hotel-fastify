# EJEMPLO — NO aplicar con valores reales en Git.
# Crear secrets reales con el script:
#   powershell -File k8s/observability/create-secrets.ps1
apiVersion: v1
kind: Secret
metadata:
  name: otel-lab-basicauth
  namespace: observability
type: Opaque
stringData:
  # Formato htpasswd: usuario:hash
  # Usuario fijo de laboratorio: otel-lab
  htpasswd: "otel-lab:REPLACE_WITH_BCRYPT_HASH"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: observability
type: Opaque
stringData:
  admin-password: "REPLACE_ADMIN_PASSWORD"
