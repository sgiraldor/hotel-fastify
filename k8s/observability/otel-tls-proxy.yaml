# Proxy TLS ligero (nginx) frente al collector.
# HTTPS NodePort 31443 — Basic Auth cifrado. Sin LoadBalancer nuevo.
# Cert lab autofirmado (IP SAN). Let's Encrypt requiere dominio público (bloqueo).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-tls-proxy-nginx
  namespace: observability
  labels:
    app: otel-tls-proxy
data:
  nginx.conf: |
    worker_processes 1;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;
    events { worker_connections 256; }
    http {
      access_log /var/log/nginx/access.log;
      client_max_body_size 4m;
      limit_req_zone $binary_remote_addr zone=otlp:1m rate=20r/s;

      upstream otel_collector {
        server otel-collector.observability.svc.cluster.local:4318;
        keepalive 8;
      }

      server {
        listen 8443 ssl;
        server_name 157.137.233.183;

        ssl_certificate     /etc/otel-tls/tls.crt;
        ssl_certificate_key /etc/otel-tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location = /healthz {
          add_header Content-Type text/plain;
          return 200 'ok';
        }

        location /v1/traces {
          limit_req zone=otlp burst=40 nodelay;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header Content-Type $http_content_type;
          proxy_pass http://otel_collector/v1/traces;
        }

        location /v1/metrics {
          limit_req zone=otlp burst=40 nodelay;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header Content-Type $http_content_type;
          proxy_pass http://otel_collector/v1/metrics;
        }

        location / {
          return 404;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-tls-proxy
  namespace: observability
  labels:
    app: otel-tls-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-tls-proxy
  template:
    metadata:
      labels:
        app: otel-tls-proxy
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/otel-tls
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: nginx-config
          configMap:
            name: otel-tls-proxy-nginx
        - name: tls
          secret:
            secretName: otel-tls-lab
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-https
  namespace: observability
  labels:
    app: otel-tls-proxy
    exposure: nodeport-https-lab
spec:
  type: NodePort
  selector:
    app: otel-tls-proxy
  ports:
    - name: https
      port: 443
      targetPort: https
      nodePort: 31443
