# EJEMPLO — no contiene credenciales reales.
# Crear el Secret real fuera de Git, por ejemplo:
#   kubectl create secret generic hotel-api-secrets \
#     --from-literal=DB_USER='...' \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=CHAOS_LAB_TOKEN='...' \
#     --from-literal=OTEL_EXPORTER_OTLP_HEADERS='Authorization=Basic <base64(otel-lab:TOKEN)>'
# OTLP headers también los aplica k8s/observability/create-secrets.ps1
apiVersion: v1
kind: Secret
metadata:
  name: hotel-api-secrets
  labels:
    app: hotel-api
    owner: samuel
type: Opaque
stringData:
  DB_USER: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  CHAOS_LAB_TOKEN: "REPLACE_LAB_TOKEN"
  OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic REPLACE_BASE64"
