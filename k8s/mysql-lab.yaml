# MySQL de laboratorio en el cluster (NO es MySQL Database Service managed).
# Usar solo para demo académica con PVC pequeño. Credenciales vía Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-mysql-init
  labels:
    app: hotel-mysql
    owner: samuel
data:
  01-schema-seed.sql: |
    USE hotel_db;
    CREATE TABLE IF NOT EXISTS huesped (
        id INT AUTO_INCREMENT PRIMARY KEY,
        identificacion VARCHAR(255) NOT NULL,
        nombre VARCHAR(255) NOT NULL,
        apellido VARCHAR(255) NOT NULL,
        telefono VARCHAR(255) NOT NULL,
        email VARCHAR(255) NOT NULL,
        tipoDocumento VARCHAR(255) NOT NULL,
        fechaNacimiento DATE NOT NULL,
        UNIQUE KEY uq_huesped_documento (tipoDocumento, identificacion)
    );
    CREATE TABLE IF NOT EXISTS habitacion (
        id INT AUTO_INCREMENT PRIMARY KEY,
        numeroHabitacion VARCHAR(255) NOT NULL UNIQUE,
        precioHabitacion DECIMAL(10,2) NOT NULL,
        estadoHabitacion VARCHAR(255) NOT NULL,
        tipoHabitacion VARCHAR(255) NOT NULL
    );
    CREATE TABLE IF NOT EXISTS checkin (
        id INT AUTO_INCREMENT PRIMARY KEY,
        huespedId INT NOT NULL,
        habitacionId INT NOT NULL,
        fechaIngreso DATETIME NOT NULL,
        fechaSalida DATE NOT NULL,
        pagoTotalHabitacion DECIMAL(10,2) NOT NULL,
        pagoRealizado DECIMAL(10,2) NOT NULL,
        estadoPago VARCHAR(255) NOT NULL,
        estado VARCHAR(255) NOT NULL,
        CONSTRAINT fk_checkin_huesped FOREIGN KEY (huespedId) REFERENCES huesped(id),
        CONSTRAINT fk_checkin_habitacion FOREIGN KEY (habitacionId) REFERENCES habitacion(id)
    );
    INSERT INTO habitacion (id, numeroHabitacion, precioHabitacion, estadoHabitacion, tipoHabitacion)
    VALUES (1, '101', 150000.00, 'Disponible', 'Doble')
    ON DUPLICATE KEY UPDATE numeroHabitacion = VALUES(numeroHabitacion);
    INSERT INTO huesped (id, identificacion, nombre, apellido, telefono, email, tipoDocumento, fechaNacimiento)
    VALUES (1, '1000000001', 'Ana', 'Prueba', '3000000000', 'ana.prueba@example.com', 'CC', '1990-01-01')
    ON DUPLICATE KEY UPDATE nombre = VALUES(nombre);
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hotel-mysql-pvc
  labels:
    app: hotel-mysql
    owner: samuel
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: oci-bv
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-mysql
  labels:
    app: hotel-mysql
    owner: samuel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-mysql
  template:
    metadata:
      labels:
        app: hotel-mysql
        owner: samuel
    spec:
      containers:
        - name: mysql
          # Nombre completo: CRI-O en OKE exige short-name no ambiguo.
          image: docker.io/library/mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_DATABASE
              value: hotel_db
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-api-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hotel-mysql-pvc
        - name: init
          configMap:
            name: hotel-mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-mysql
  labels:
    app: hotel-mysql
    owner: samuel
spec:
  type: ClusterIP
  selector:
    app: hotel-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
