# MySQL de laboratorio en el cluster (NO es MySQL Database Service managed).
# Usar solo para demo académica con PVC pequeño. Credenciales vía Secret.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hotel-mysql-pvc
  labels:
    app: hotel-mysql
    owner: samuel
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-mysql
  labels:
    app: hotel-mysql
    owner: samuel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-mysql
  template:
    metadata:
      labels:
        app: hotel-mysql
        owner: samuel
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_DATABASE
              value: hotel_db
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-api-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hotel-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-mysql
  labels:
    app: hotel-mysql
    owner: samuel
spec:
  type: ClusterIP
  selector:
    app: hotel-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
