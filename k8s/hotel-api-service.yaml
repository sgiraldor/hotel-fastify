apiVersion: v1
kind: Service
metadata:
  name: hotel-api
  labels:
    app: hotel-api
    service: hotel
    owner: samuel
  annotations:
    # Network Load Balancer = Free en la Price List de OCI (más barato que Flexible LB).
    oci.oraclecloud.com/load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: hotel-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http

