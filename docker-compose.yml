services:
  mysql:
    image: mysql:8.4
    container_name: hotel-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_db

    ports:
      - "3307:3306"

    volumes:
      - hotel_mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h localhost -uroot -proot -e 'USE hotel_db; SELECT 1;'"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  api:
    build: .
    container_name: hotel-api

    ports:
      - "3000:3000"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: hotel_db
      OTEL_SERVICE_NAME: hotel-api
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      CHAOS_LAB_TOKEN: ${CHAOS_LAB_TOKEN:-}
      RESILIENCE_MODE: ${RESILIENCE_MODE:-protected}
      DB_POOL_LIMIT: ${DB_POOL_LIMIT:-10}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-2000}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-3000}

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

    restart: on-failure

volumes:
  hotel_mysql_data: