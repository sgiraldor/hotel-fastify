name: Chaos gate Hotel

# Puerta de calidad del Seguimiento #4.
# El fallo solo existe dentro del runner, contra http://127.0.0.1:3000.
# No usa OCI, Sports, Cine, Kubernetes ni el perfil k6 multicloud.

on:
  workflow_dispatch:
    inputs:
      demostrar_fallo:
        description: "true ejecuta la corrida negativa, sin inyectar el 503"
        type: boolean
        default: false
  push:
    branches:
      - feat/seguimiento-4-chaos
    paths:
      - .github/workflows/chaos-hotel-manual.yml
      - chaos/GATE_MODE

concurrency:
  group: chaos-gate-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  chaos-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOTEL_BASE_URL: http://127.0.0.1:3000
      GATE_OBS_FILE: ${{ github.workspace }}/chaos-gate-results/observations.json
      COMPOSE_FILE: docker-compose.yml:chaos/docker-compose.gate.yml
      COMPOSE_PROJECT_NAME: hotel-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Chaos Toolkit
        run: python -m pip install --disable-pip-version-check chaostoolkit

      - name: Rechazar cualquier host que no sea el runner
        run: node chaos/gate-preflight.mjs

      - name: Token temporal
        run: |
          set +x
          token=$(openssl rand -hex 16)
          echo "::add-mask::$token"
          echo "CHAOS_LAB_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Levantar Hotel y MySQL aislados
        run: docker compose up -d --build --wait

      - name: Sembrar habitación y comprobar el estado estable
        run: |
          set -euo pipefail
          docker compose exec -T mysql sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" hotel_db' < chaos/seed-habitacion.sql
          id=$(docker compose exec -T mysql sh -c 'mysql --batch --skip-column-names -uroot -p"$MYSQL_ROOT_PASSWORD" hotel_db -e "SELECT id FROM habitacion WHERE numeroHabitacion='"'"'gate-101'"'"';"')
          id=$(echo "$id" | tr -d '[:space:]')
          if [ -z "$id" ]; then
            echo "CAUSA: la habitación de laboratorio no quedó sembrada"
            exit 1
          fi
          echo "HOTEL_HABITACION_ID=$id" >> "$GITHUB_ENV"
          echo "habitacion_id=$id"
          for _ in $(seq 1 30); do
            codigo=$(curl -sS -o /dev/null -w "%{http_code}" -H "x-trace-id: gate-espera" "$HOTEL_BASE_URL/api/v2/habitacion/$id" || true)
            if [ "$codigo" = "200" ]; then
              echo "estado_estable=200"
              exit 0
            fi
            sleep 2
          done
          echo "CAUSA: el estado estable no llegó a HTTP 200"
          exit 1

      - name: Ejecutar el experimento declarativo
        id: chaos
        run: |
          set -o pipefail
          mkdir -p chaos-gate-results
          echo '[]' > chaos-gate-results/observations.json
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            modo="${{ inputs.demostrar_fallo }}"
          else
            modo=$(tr -d '[:space:]' < chaos/GATE_MODE)
          fi
          if [ "$modo" = "true" ] || [ "$modo" = "negative" ]; then
            experimento=chaos/experiment-hotel-gate-negative.json
          else
            experimento=chaos/experiment-hotel-gate.json
          fi
          echo "experimento=$experimento"
          set +e
          chaos run \
            --rollback-strategy always \
            --journal-path chaos-gate-results/journal.json \
            "$experimento" \
            > chaos-gate-results/chaos-stdout.txt \
            2> chaos-gate-results/chaos-stderr.txt
          codigo=$?
          set -e
          node chaos/gate-scrub.mjs chaos-gate-results
          exit "$codigo"

      - name: Evaluar umbrales
        if: always()
        run: |
          set +e
          set -o pipefail
          node chaos/gate-evaluator.mjs chaos-gate-results/observations.json | tee chaos-gate-results/evaluacion.txt
          codigo=${PIPESTATUS[0]}
          {
            echo "## Evaluacion"
            cat chaos-gate-results/evaluacion.txt
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r linea; do
            case "$linea" in
              CAUSA:*) echo "::error::$linea" ;;
              "") ;;
              *) echo "::notice::$linea" ;;
            esac
          done < chaos-gate-results/evaluacion.txt
          exit "$codigo"

      - name: Revertir y limpiar
        if: always()
        run: |
          set +e
          mkdir -p chaos-gate-results
          {
            echo "disable_inicio=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            node chaos/gate-probe.mjs disable
            codigo_hab=$(curl -sS -o /dev/null -w "%{http_code}" -H "x-trace-id: gate-reversion" "$HOTEL_BASE_URL/api/v2/habitacion/${HOTEL_HABITACION_ID:-1}" || echo caido)
            codigo_live=$(curl -sS -o /dev/null -w "%{http_code}" "$HOTEL_BASE_URL/live" || echo caido)
            echo "habitacion_despues=$codigo_hab"
            echo "live_despues=$codigo_live"
            docker compose down -v --remove-orphans
            echo "compose_down=$?"
            docker compose ps -a
          } > chaos-gate-results/reversion.txt 2>&1
          node chaos/gate-scrub.mjs chaos-gate-results || true
          cat chaos-gate-results/reversion.txt
          {
            echo "## Reversion"
            cat chaos-gate-results/reversion.txt
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(disable_status|habitacion_despues|live_despues|compose_down)=' chaos-gate-results/reversion.txt | while IFS= read -r linea; do
            echo "::notice::$linea"
          done

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: chaos-gate-results/
          if-no-files-found: error
          retention-days: 14
