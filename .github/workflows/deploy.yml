name: Deploy Hotel API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/hotel-github-actions.pem
          chmod 600 ~/.ssh/hotel-github-actions.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/hotel-github-actions.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "echo 'SSH hacia EC2 funcionando'"

      - name: Verify Docker
        run: |
          ssh -i ~/.ssh/hotel-github-actions.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "docker --version && sudo systemctl is-active docker"