name: Deploy Hotel API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t samuel1424/hotel-api:latest .

      - name: Push Docker image
        run: |
          docker push samuel1424/hotel-api:latest

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/hotel-github-actions.pem
          chmod 600 ~/.ssh/hotel-github-actions.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        shell: bash
        run: |
          ssh -i ~/.ssh/hotel-github-actions.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'bash -s' <<'REMOTE'

          set -e

          REGION="us-east-2"
          DB_IDENTIFIER="hotel-mysql"

          echo "========================================"
          echo "CONSULTANDO INFORMACIÓN DE RDS"
          echo "========================================"

          RDS_INFO=$(aws rds describe-db-instances \
            --region "$REGION" \
            --db-instance-identifier "$DB_IDENTIFIER" \
            --output json)

          DB_HOST=$(echo "$RDS_INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["DBInstances"][0]["Endpoint"]["Address"])')
          DB_USER=$(echo "$RDS_INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["DBInstances"][0]["MasterUsername"])')
          DB_NAME=$(echo "$RDS_INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["DBInstances"][0]["DBName"])')
          RDS_SECRET_ARN=$(echo "$RDS_INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["DBInstances"][0]["MasterUserSecret"]["SecretArn"])')

          echo "RDS encontrado: $DB_HOST"
          echo "Usuario de RDS: $DB_USER"
          echo "Base de datos: $DB_NAME"

          echo "========================================"
          echo "OBTENIENDO CREDENCIALES"
          echo "========================================"

          aws secretsmanager get-secret-value \
            --region "$REGION" \
            --secret-id "$RDS_SECRET_ARN" \
            --query SecretString \
            --output text \
            --no-cli-pager > /tmp/hotel-rds-secret.json

          DB_PASSWORD=$(python3 -c 'import json; print(json.load(open("/tmp/hotel-rds-secret.json"))["password"])')

          echo "========================================"
          echo "OBTENIENDO URL DE SQS"
          echo "========================================"

          SQS_QUEUE_URL=$(aws sqs get-queue-url \
            --region "$REGION" \
            --queue-name hotel-queue \
            --query QueueUrl \
            --output text)

          echo "SQS encontrado: $SQS_QUEUE_URL"

          echo "========================================"
          echo "DESCARGANDO IMAGEN"
          echo "========================================"

          docker pull samuel1424/hotel-api:latest

          echo "========================================"
          echo "DETENIENDO CONTENEDOR ANTERIOR"
          echo "========================================"

          docker rm -f hotel-api 2>/dev/null || true

          echo "========================================"
          echo "INICIANDO CONTENEDOR"
          echo "========================================"

          docker run -d \
            --name hotel-api \
            --restart unless-stopped \
            -p 3000:3000 \
            -e DB_HOST="$DB_HOST" \
            -e DB_PORT="3306" \
            -e DB_USER="$DB_USER" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e DB_NAME="$DB_NAME" \
            -e AWS_REGION="$REGION" \
            -e SQS_QUEUE_URL="$SQS_QUEUE_URL" \
            -e OTEL_TRACES_EXPORTER="none" \
            -e OTEL_METRICS_EXPORTER="none" \
            samuel1424/hotel-api:latest

          echo "========================================"
          echo "ESPERANDO INICIO DE LA API"
          echo "========================================"

          sleep 10

          echo "========================================"
          echo "ESTADO DEL CONTENEDOR"
          echo "========================================"

          docker ps -a --filter "name=hotel-api"

          docker inspect hotel-api \
            --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}}'

          echo "========================================"
          echo "PRUEBA GET /"
          echo "========================================"

          curl --fail http://localhost:3000/ || true

          echo ""
          echo "========================================"
          echo "PRUEBA POST /huesped"
          echo "========================================"

          curl -i -X POST http://localhost:3000/huesped \
            -H "Content-Type: application/json" \
            -d '{
              "identificacion": "9999999999",
              "nombre": "Prueba",
              "apellido": "Postman",
              "telefono": "3001234567",
              "tipoDocumento": "CC",
              "fechaNacimiento": "2000-01-15"
            }' || true

          echo ""
          echo "========================================"
          echo "LOGS DESPUÉS DEL POST"
          echo "========================================"

          docker logs hotel-api --tail 200 || true

          echo "========================================"
          echo "ELIMINANDO CREDENCIALES TEMPORALES"
          echo "========================================"

          rm -f /tmp/hotel-rds-secret.json

          echo "========================================"
          echo "DESPLIEGUE COMPLETADO"
          echo "========================================"

          REMOTE

      - name: Verify API
        shell: bash
        run: |
          sleep 5

          echo "========================================"
          echo "VERIFICACIÓN EXTERNA DE LA API"
          echo "========================================"

          curl --fail http://${{ secrets.EC2_HOST }}:3000/

          echo ""
          echo "API funcionando correctamente."