name: Pipeline de Produccion

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  produccion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Ejecutar pruebas
        run: npm test

      - name: Ejecutar cobertura con Quality Gate de Produccion
        run: npx vitest run --coverage --coverage.thresholds.statements=85 --coverage.thresholds.lines=85 --coverage.thresholds.functions=85