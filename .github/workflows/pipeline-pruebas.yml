name: Pipeline de Pruebas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Ejecutar pruebas
        run: npm test

      - name: Ejecutar cobertura
        run: npm run test:coverage

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Desplegar ambiente de pruebas
        if: github.event_name == 'push'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRUEBAS }}
        run: railway up --service hotel-fastify --environment pruebas --project b53fb89c-8c01-48a7-b35d-4010dfa2579f --ci