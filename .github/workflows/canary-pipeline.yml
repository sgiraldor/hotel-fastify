name: Canary CI/CD

on:
  push:
    branches:
      - v4-canary
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: hotel-canary-v4
  REGION: us-east1
  GAR_REPOSITORY: hotel-repo
  SERVICE: hotel-v4-canary
  SERVICE_ACCOUNT: github-actions-deployer@hotel-canary-v4.iam.gserviceaccount.com
  WIF_PROVIDER: projects/187902760857/locations/global/workloadIdentityPools/github-actions/providers/github

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto
        run: npm run build

      - name: Ejecutar pruebas
        run: npm test

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Construir imagen Docker
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$IMAGE:$IMAGE_TAG" .
          docker push "$IMAGE:$IMAGE_TAG"

      - name: Mostrar imagen publicada
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          gcloud artifacts docker images describe \
            "$IMAGE:$IMAGE_TAG" \
            --format="yaml(image_summary)"
