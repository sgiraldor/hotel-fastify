# Configuracion academica de ejemplo para Collector compartido.
# No despliega nada por si sola. Ajustar exporters al stack del equipo.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}
  attributes:
    actions:
      - key: team
        value: seguimiento-4
        action: upsert

exporters:
  logging:
    verbosity: basic
  # prometheus:
  #   endpoint: 0.0.0.0:8889
  # otlp/tempo:
  #   endpoint: tempo:4317
  #   tls:
  #     insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, attributes]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch, attributes]
      exporters: [logging]
